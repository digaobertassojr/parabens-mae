<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Feliz aniversário, Mamãe!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Nunito:wght@400;600&display=swap">
<style>
:root{
  --bg:#000000; --text:#FFFFFF; --water:#2EA3C9; --deep:#0E3B5C; --sun:#FFC83D; --rose:#FF6F91;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000000;--text:#FFFFFF;}}
:root[data-theme="dark"]{--bg:#000000;--text:#FFFFFF;}
*,*::before,*::after{box-sizing:inherit}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:"Nunito",system-ui,sans-serif;font-size:18px;line-height:1.5;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 20px;overflow-x:hidden}
h1{font-family:"Bricolage Grotesque","Trebuchet MS",sans-serif;font-weight:800;font-size:clamp(2.2rem,9vw,3.4rem);line-height:1.05;margin:0 0 12px}
p{margin:0 auto 12px;max-width:30ch}
.intro{font-weight:600;margin-bottom:16px}
.card{background:#fff;border-radius:28px;padding:14px 18px;width:min(72vw,300px);margin:0 auto 24px;box-shadow:0 14px 0 -4px rgba(14,59,92,.25)}
.wrap{position:relative}
.wrap img{display:block;width:100%;height:auto}
.glass{position:absolute;left:12.5%;top:20.5%;width:74.5%;aspect-ratio:1;border-radius:50%;overflow:hidden;display:none}
.running .glass{display:block}
.running .wrap{animation:shake .25s linear infinite}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-1.5px)}75%{transform:translateX(1.5px)}}
.water{position:absolute;inset:0;background:rgba(46,163,201,.55)}
.drum{position:absolute;inset:0;opacity:.75;
  background:conic-gradient(var(--sun) 0 12%,transparent 12% 25%,var(--rose) 25% 37%,transparent 37% 50%,var(--sun) 50% 62%,transparent 62% 75%,var(--rose) 75% 87%,transparent 87%);
  animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.bub{position:absolute;bottom:-12%;border-radius:50%;background:rgba(255,255,255,.75);animation:rise 2.4s ease-in infinite}
@keyframes rise{to{bottom:105%;opacity:0}}
button{font:inherit;font-weight:600;font-size:1.1rem;padding:14px 28px;border:0;border-radius:999px;background:var(--rose);color:#fff;cursor:pointer;box-shadow:0 5px 0 #c24467}
button:active{transform:translateY(3px);box-shadow:0 2px 0 #c24467}
button:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
#msg{display:none}
#msg.show{display:block;animation:pop .6s ease-out}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.modelo{font-weight:600}
.chega{display:inline-block;background:var(--sun);color:#0E3B5C;font-weight:700;padding:8px 16px;border-radius:14px;margin:6px 0 14px}
.foto{margin:8px auto 18px;width:min(86vw,420px)}
.foto img{display:block;width:100%;height:auto;border-radius:20px;border:4px solid var(--sun)}
.foto figcaption{margin-top:8px;font-weight:600}
.cover{position:absolute;inset:-14px -18px;border-radius:28px;display:grid;place-items:center;z-index:2;
  background:linear-gradient(var(--sun),var(--sun)) center/100% 26px no-repeat,linear-gradient(var(--sun),var(--sun)) center/26px 100% no-repeat,var(--rose)}
.cover span{background:#fff;color:#0E3B5C;font-family:"Bricolage Grotesque","Trebuchet MS",sans-serif;font-weight:800;font-size:1.2rem;padding:10px 20px;border-radius:999px}
.opened .cover{animation:lift .7s ease-in forwards;pointer-events:none}
@keyframes lift{to{transform:translateY(-24px) scale(1.08);opacity:0;visibility:hidden}}
@media (prefers-reduced-motion:reduce){.opened .cover{animation:none;display:none}}
.conf{position:fixed;top:-20px;width:10px;height:14px;animation:fall linear forwards;z-index:5;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){.running .wrap,.drum,.bub,#msg.show{animation:none}.conf{display:none}}
</style>
</head>

<script>
(function(){
  var btn=document.getElementById("btn"), machine=document.getElementById("machine"),
      msg=document.getElementById("msg"), start=document.getElementById("start"),
      bubbles=document.getElementById("bubbles");
  var reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function makeBubbles(){
    for(var i=0;i<14;i++){
      var b=document.createElement("span"); b.className="bub";
      var s=6+Math.random()*12;
      b.style.width=b.style.height=s+"px";
      b.style.left=Math.random()*90+"%";
      b.style.animationDelay=(Math.random()*2.4)+"s";
      bubbles.appendChild(b);
    }
  }
  function confetti(){
    if(reduce) return;
    var cores=["#FFC83D","#FF6F91","#2EA3C9","#FFFFFF"];
    for(var i=0;i<60;i++){
      var c=document.createElement("div"); c.className="conf";
      c.style.left=Math.random()*100+"vw";
      c.style.background=cores[i%cores.length];
      c.style.animationDuration=(2.5+Math.random()*2.5)+"s";
      c.style.animationDelay=(Math.random()*0.8)+"s";
      document.body.appendChild(c);
      setTimeout(function(el){el.remove()}.bind(null,c),6500);
    }
  }
  btn.addEventListener("click",function(){
    btn.style.display="none";
    start.style.display="none";
    machine.classList.add("opened");
    setTimeout(function(){machine.classList.add("running");makeBubbles();}, reduce?0:800);
    setTimeout(function(){
      machine.classList.remove("running");
      msg.classList.add("show");
      confetti();
    }, reduce?300:3800);
  });
})();
</script>
